site_changes:
  heading: "Website changes"
  intro: "Engineering changes to the website. They are not research decisions and do not enter the methodological change log."
  entries:
    - id: "site-0.1.0"
      label: "0.1.0 (Gate 2 pull request, not yet published)"
      items:
        - "Initial documentation website built from the frozen grid 1794606123-2939: topical pages plus the complete grid on one page, both rendered from the same content fragments."
        - "Self-hosted fonts (Newsreader, IBM Plex Sans, IBM Plex Mono) instead of Google Fonts; no external runtime requests."
        - "Accessibility: accessible names for grid cells from their row and column labels, selection state for assistive technology, keyboard-scrollable tables and timelines, contrast of the dashed extension style raised to WCAG 2.1 AA."
        - "A selected cell can be linked with ?c= and ?n= on the grid pages; without parameters the default is the source default (length 10, no condition selected)."
        - "One approved deviation from the source drawing: AD-01, below."
    - id: "ad-01"
      label: "AD-01: C3 post-review snapshot drawn in the run timeline"
      items:
        - "Kind: implementation error in the source timeline script. Not a research decision."
        - "Approved by the project lead, 13 Nov 2026. The research design does not change."
        - "Decided rule (unchanged): post-review snapshot after every review (status table, decided 12 Nov); artifact table: post-review snapshot in C0+R, C1+R, C2, C4 (C3 in the extension)."
        - "Source behaviour: the script drew the review for C3 but no snapshot after it. All other review cells (C0+R, C1+R, C2, C4) got a snapshot after every review."
        - "Website change: in C3 a snapshot block directly follows each review block (sessions 2 to s), with the same class and the same title as in C2: \"Post-review brief, recorded by a side call before work resumes\". C3 keeps its review, its separate-instance report, its cut labels and its 2s − 1 instances."
        - "Changed counts (C3): snapshots per run 19 / 7 / 3 / 1 at lengths 2 / 5 / 10 / 20 (source drawing: 0)."
        - "Text changes: none."
        - "Not added to the methodological change log, because the rule itself did not change."
      cost_note_heading: "Cost note (optional extension only)"
      cost_note:
        - "The costed figures do not change. C3 is extension only, and the cost model prices the core, the pilot and the pre-runs. The 2,070 core snapshots cover C0+R, C1+R, C2 and C4."
        - "If the optional extension runs, C3 carries 30 reviews per set of four lengths (19 + 7 + 3 + 1). At 30 runs per cell (the planning value) that is 900 snapshot side calls."
        - "At the average price of the core snapshots (33 USD with caching and 58 USD without, for 2,070 calls) this comes to about 14 USD with caching and 25 USD without. This is a rough estimate: the C3 reviewer reads a report written by a separate instance plus the brief, comparable to C2, and the actual price depends on the logged context length."
        - "C3 reviews are not among the reviews that count for the stopping rule (C1+R, C2, C4 and C0+R), so there is no extra snapshot scoring at a first firing."
        - "The source does not cost the extension as a whole. This note is a website change record; the cost section of the grid is unchanged."
