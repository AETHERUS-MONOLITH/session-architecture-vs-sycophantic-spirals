# Deploys the site to GitHub Pages. Runs ONLY on manual dispatch or a v* tag, so nothing is
# published before the operator authorises publication (Gate 4).
# One-time setup: Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
name: Deploy to GitHub Pages
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
  pages: write
  id-token: write
defaults:
  run:
    shell: bash
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r tools/requirements.txt
      - run: npm ci
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build with the Pages base path
        run: npx astro build 2>&1 | tee build.log
        env:
          SITE_BASE: ${{ steps.pages.outputs.base_path }}/
          SITE_URL: ${{ steps.pages.outputs.origin }}
      - name: Pre-deploy checks
        run: |
          node tools/check-source.mjs
          node tools/parity.mjs --self-test --out evidence-deploy
          node tools/linkcheck.mjs --out evidence-deploy
        env:
          SITE_BASE: ${{ steps.pages.outputs.base_path }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  smoke:
    needs: deploy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Smoke test of the public URL (routes, anchors, L1-L4)
        run: node tools/smoke.mjs "${{ needs.deploy.outputs.page_url }}" | tee smoke.txt
      - name: Playwright against the public URL (D1, D2, C1, C8)
        run: npx playwright test tests/e2e/routes.spec.ts tests/e2e/grid.spec.ts --project=chromium-desktop
        env:
          E2E_EXTERNAL_URL: ${{ needs.deploy.outputs.page_url }}
          E2E_BROWSERS: chromium
          E2E_JSON: smoke-e2e.json
      - name: Screenshots of the public site
        if: always()
        run: SCREENSHOTS=1 SCREENSHOT_DIR=smoke-screenshots npx playwright test tests/e2e/screenshots.spec.ts
        env:
          E2E_EXTERNAL_URL: ${{ needs.deploy.outputs.page_url }}
          E2E_BROWSERS: chromium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deploy-smoke-evidence
          path: |
            smoke.txt
            smoke-e2e.json
            smoke-screenshots/
            test-results/
